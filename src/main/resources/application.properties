# Application
spring.application.name=employee-management
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Note: spring.jpa.database-platform is intentionally omitted — Hibernate 6
# auto-detects the H2 dialect; specifying it explicitly triggers HHH90000025.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable Open Session In View — prevents lazy-load queries during view rendering.
spring.jpa.open-in-view=false

# Data initialization — defer so JPA creates tables BEFORE data.sql runs
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.employee=DEBUG

# ── Spring AI / Ollama ─────────────────────────────────────────────────────
# Ollama must be running locally: https://ollama.com
# Pull a model first, e.g.:
#   ollama pull llama3.2
#   ollama pull gemma3
#   ollama pull mistral
#
# Base URL — default Ollama port. Override with OLLAMA_BASE_URL env var if needed.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
#
# Model to use — change to any model you have pulled in Ollama:
#   llama3.2 | llama3.1 | gemma3 | gemma2 | mistral | mistral-nemo | phi4 | qwen2.5
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
#
# Lower temperature = more factual / deterministic answers
spring.ai.ollama.chat.options.temperature=0.2
#
# Pull the model automatically on startup if it is not already present locally.
# Set to false if you prefer to manage models manually via the ollama CLI.
spring.ai.ollama.init.pull-model-strategy=when_missing

# Disable Spring AI's default ChatClient auto-builder so we configure it
# manually in AiChatService with our system prompt and tools.
spring.ai.chat.client.enabled=false
